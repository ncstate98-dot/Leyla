<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Matrix Valentine Game</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #entry-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #entryBtn {
            background: #000;
            border: 2px solid #00FF41;
            color: #00FF41;
            padding: 25px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px #00FF41;
        }
        #main-ui {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            position: relative;
            z-index: 5;
        }
        #heart-container {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }
        #question { font-size: 1.3rem; margin-bottom: 20px; padding: 0 15px; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            z-index: 50;
            cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 60;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #taunt {
            margin-top: 40px;
            height: 20px;
            font-size: 0.9rem;
            color: #ff4d4d;
            font-weight: bold;
            text-transform: uppercase;
        }
        #message {
            margin-top: 5px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 80px;
            padding: 0 25px;
            max-width: 85%;
            line-height: 1.4;
        }
        #counterContainer {
            position: fixed;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border: 1px solid #00FF41;
            background: rgba(0,0,0,0.9);
            z-index: 5;
        }
        .val-photo {
            width: 110px;
            height: auto;
            border: 3px solid #00FF41;
            border-radius: 4px;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .matrix-bit {
            position: fixed;
            top: -20px;
            color: #00FF41;
            animation: rain linear infinite;
        }
    </style>
</head>
<body>

    <div id="entry-screen">
        <button id="entryBtn">INITIALIZE SYSTEM</button>
        <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.7;">(System Pacing: Optimal)</p>
    </div>

    <audio id="bgMusic" loop>
        <source src="matrix.mp3" type="audio/mpeg">
    </audio>

    <div id="main-ui">
        <div id="heart-container"></div>
        <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>
        <button id="yesBtn">Yes</button>
        
        <div id="taunt"></div>
        <div id="message">System Ready...</div>
        
        <button id="noBtn">No</button>
        
        <div id="counterContainer">
            <p style="font-size: 0.6rem; margin: 0 0 5px 0; letter-spacing: 1px; opacity: 0.8;">TOTAL ANOMALIES DETECTED:</p>
            <div style="font-size: 1.4rem; font-weight: bold; letter-spacing: 4px; text-shadow: 0 0 5px #00FF41;">0014</div>
        </div>
    </div>
