<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

        <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
    </div>

    <div id="message"></div>

    <script>
        let noCount = 0;
        const noBtn = document.getElementById('noBtn');
        const messageDiv = document.getElementById('message');
        const question = document.getElementById('question');

        const responses = [
            "Hey, are you sure about this?", "You think you're funny?", "There is no spoon... and there is no 'No' button.",
            "I'm trying to free your mind, Leyla.", "Choice is an illusion created between those with power and those without.",
            "Fate, it seems, is not without a sense of irony.", "Not like this... not like this.",
            "You take the blue pill, the story ends. You hit Yes, the story begins.",
            "I can only show you the door, you're the one that has to click Yes.",
            "Denial is the most predictable of all human responses.", "Mr. Anderson... I mean, Leyla... why do you persist?",
            "Were you looking at the girl in the red dress? Or trying to hit No?",
            "Everything that has a beginning has an end... except this loop.",
            "You're beginning to believe!", "I know kung fu. And I know you want to say Yes.",
            "It is the question that drives us, Leyla.", "The Matrix is everywhere. Even in this red button.",
            "Buckle your seatbelt, Dorothy, 'cause Kansas is going bye-bye.",
            "Dodging bullets is easy. Dodging this question? Harder.",
            "What is 'Real'? If 'Real' is a Yes, then click it.",
            "You’ve already made the choice. You’re here to understand why you made it.",
            "Human beings are a disease... and a 'No' is the symptom.",
            "Ignorance is bliss, but saying Yes is better.",
            "I'm going to show you a world without rules... but with a Valentine.",
            "Stop trying to hit me and hit me! (The Green one)",
            "The answer is out there, Leyla. It's looking for you.",
            "A déjà vu is usually a glitch in the Matrix. Like you trying to hit No.",
            "Would you still have tried to hit No if I hadn't said anything?",
            "You think that's air you're breathing now?", "I'm trying to help you, Leyla.",

            "There's a difference between knowing the path and walking the path.",

            "Goodbye, Mr. Anderson... Hello, Valentine.", "Sound of inevitability, Leyla.",
            "The Oracle predicted you'd be difficult.", "Just click Yes. It's the only way out of the simulation."
        ];

        const yesMessages = [
            "YES! (Did you try the no button, just to see what happens?)",
            "I knew it! (But seriously, did you see how fast that No button was?)",

            "You chose the Red Pill! Wait, no, the Green Button. Same thing!",
            "Welcome to the real world. (Try the No button if you think you're fast enough!)"
        ];

        function moveNo() {
            noCount++;
            
            // Random position
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;

            // Message logic
            if (noCount % 5 === 0) {
                const randomIndex = Math.floor(Math.random() * responses.length);
                messageDiv.innerText = responses[randomIndex];
            }
        }

        function sayYes() {
            const randomYes = yesMessages[Math.floor(Math.random() * yesMessages.length)];
            document.body.innerHTML = `<h1>${randomYes}</h1><p style="font-size: 5rem;">❤️</p>`;
        }
