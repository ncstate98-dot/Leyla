<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine Final</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #main-ui {
            width: 100%;
            height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
            position: relative;
        }
        #question { font-size: 1.4rem; margin-bottom: 25px; z-index: 5; padding: 0 15px; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            z-index: 5;
            cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 10;
            touch-action: none;
        }
        #message {
            margin-top: 100px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 80px;
            z-index: 5;
            padding: 0 25px;
            line-height: 1.4;
            max-width: 85%;
        }
        #counterContainer {
            position: fixed;
            top: 75vh; 
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border: 1px solid #00FF41;
            z-index: 5;
            background: rgba(0,0,0,0.95);
        }
        #counterText {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #00FF41;
        }
        .val-photo {
            width: 120px;
            height: auto;
            border: 3px solid #00FF41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            border-radius: 4px;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .matrix-bit {
            position: fixed;
            top: -20px;
            color: #00FF41;
            font-size: 1rem;
            user-select: none;
            z-index: 1;
            animation: rain linear infinite;
        }
    </style>
</head>
<body>

    <div id="main-ui">
        <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <div id="message"></div>
        <button id="noBtn" onmouseover="moveNo(event)" ontouchstart="moveNo(event)">No</button>
    </div>

    <div id="counterContainer">
        <p style="font-size: 0.6rem; margin: 0 0 5px 0; letter-spacing: 1px; opacity: 0.8;">TOTAL ANOMALIES DETECTED:</p>
        <div id="counterText">0000</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const q = document.getElementById('question');
        const counterBox = document.getElementById('counterContainer');
        const counterText = document.getElementById('counterText');

        let scale = 1.0;
        let count = 0;

        const story = [
            "Wait, maybe reconsider?",
            "Are you absolutely sure?",
            "I heard that Bobby is a catch... maybe rethink that.",
            "Choice is an illusion, Leyla.",
            "I'm trying to free your mind here.",
            "Really? You're still going for 'No'?",
            "Come on... Really?",
            "This is getting a bit awkward now.",
            "I think someone is trying to be funny, that's awesome 😐",
            "Ok, me being the gentleman that I am, will respond with a: 'are you fucking with me!?'"
        ];

        async function loadCounter() {
            const hasBeenHere = localStorage.getItem('leyla_owner');
            const hitType = hasBeenHere ? 'get' : 'hit';
            try {
                const response = await fetch(`https://api.countapi.xyz/${hitType}/ncstate98-final-valentines/hits`);
                const data = await response.json();
                counterText.innerText = data.value.toString().padStart(4, '0');
                localStorage.setItem('leyla_owner', 'true');
            } catch (e) {
                counterText.innerText = "0008"; 
            }
        }

        window.onload = () => {
            loadCounter();
            resetNo();
        };

        function resetNo() {
            const yR = yesBtn.getBoundingClientRect();
            noBtn.style.left = (window.innerWidth / 2 - noBtn.offsetWidth / 2) + 'px';
            noBtn.style.top = (yR.bottom + 30) + 'px';
        }

        function moveNo(e) {
            if (e && e.cancelable) e.preventDefault();
            
            // Set message
            if (count < story.length) { msg.innerText = story[count]; } 
            else { msg.innerText = "Just take the red pill and click Yes."; }
            
            count++;
            scale += 0.05;
            yesBtn.style.transform = `scale(${scale})`;

            let nX, nY;
            for(let i=0; i<150; i++) {
                nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
                nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
                
                const nR = { left: nX, right: nX + noBtn.offsetWidth, top: nY, bottom: nY + noBtn.offsetHeight };
                const yR = yesBtn.getBoundingClientRect();
                const qR = q.getBoundingClientRect();
                const mR = msg.getBoundingClientRect();
                const cR = counterBox.getBoundingClientRect();

                const overlap = (r1, r2) => {
                    if (r2.height === 0) return false;
                    return !(r1.right < r2.left - 20 || r1.left > r2.right + 20 || r1.bottom < r2.top - 20 || r1.top > r2.bottom + 20);
                };
                
                if (!overlap(nR, yR) && !overlap(nR, qR) && !overlap(nR, mR) && !overlap(nR, cR) && nY > 80) break;
            }
            noBtn.style.left = nX + 'px';
            noBtn.style.top = nY + 'px';
        }

        function createRain() {
            const bit = document.createElement('div');
            bit.className = 'matrix-bit';
            bit.innerText = Math.random() > 0.5 ? '1' : '0';
            bit.style.left = Math.random() * 100 + 'vw';
            bit.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(bit);
        }

        function sayYes() {
            document.body.innerHTML = "";
            document.body.style.justifyContent = "center";
            const content = document.createElement('div');
            content.style.cssText = "display: flex; flex-direction: column; align-items: center; z-index: 10; padding: 20px;";
            content.innerHTML = `
                <h1 style="color: #00FF41; font-size: 2rem; text-shadow: 0 0 10px #00FF41;">Excellent choice. ❤️</h1>
                <div style="display: flex; gap: 10px; margin: 20px 0; justify-content: center; flex-wrap: wrap;">
                    <img src="valentine1.jpg" class="val-photo" style="transform: rotate(-5deg);">
                    <img src="valentine2.jpg" class="val-photo" style="transform: rotate(2deg);">
                    <img src="valentine3.jpg" class="val-photo" style="transform: rotate(-3deg);">
                </div>
                <p style="color: #00FF41; font-size: 1.1rem; font-weight: bold; max-width: 90%;">
                    just like in the matrix, it's almost like you didn't have a choice, haha 😂
                </p>
                <p style="margin-top: 30px; color: #00FF41; opacity: 0.6; font-size: 0.8rem;">(System rebooting in 15 seconds...)</p>
            `;
            document.body.appendChild(content);
            for(let i=0; i<50; i++) { setTimeout(createRain, i * 60); }
            setTimeout(() => { window.location.reload(); }, 15000);
        }
    </script>
</body>
</html>
