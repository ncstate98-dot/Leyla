<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine Final</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #question { font-size: 1.5rem; margin-top: 20px; min-height: 80px; }
        .btn-container { margin-top: 20px; position: relative; width: 100%; height: 100px; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 100;
            touch-action: none;
        }
        #message {
            margin-top: 100px; /* Pushes message down to clear the buttons */
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 60px;
            padding: 0 20px;
        }
        /* THE COUNTER: Now clearly visible and centered */
        #counterContainer {
            margin-top: auto;
            margin-bottom: 40px; /* Moves it up from the very bottom edge */
            padding: 10px;
            border: 1px solid #00FF41;
            display: inline-block;
            align-self: center;
        }
    </style>
</head>
<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

    <div class="btn-container">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
    </div>

    <div id="message"></div>

    <button id="noBtn" onmouseover="moveNo(event)" ontouchstart="moveNo(event)">No</button>

    <div id="counterContainer">
        <p style="font-size: 0.8rem; margin: 0 0 5px 0;">SYSTEM TRAFFIC:</p>
        <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fncstate98-dot.github.io&count_bg=%2300FF41&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false" alt="Hits"/>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const q = document.getElementById('question');

        let scale = 1.0;
        let count = 0;

        const story = [
            "Wait, maybe reconsider?",
            "Are you absolutely sure?",
            "I heard that Bobby is a catch... maybe rethink that.",
            "Choice is an illusion, Leyla.",
            "I'm trying to free your mind here.",
            "Really? You're still going for 'No'?",
            "Come on... Really?",
            "This is getting a bit awkward now.",
            "Fate, it seems, is not without a sense of irony.",
            "ARE YOU FUCKING WITH ME!?"
        ];

        window.onload = () => {
            const yRect = yesBtn.getBoundingClientRect();
            // Perfectly centered start for the No button
            noBtn.style.left = (window.innerWidth / 2 - noBtn.offsetWidth / 2) + 'px';
            noBtn.style.top = (yRect.bottom + 20) + 'px';
        };

        function moveNo(e) {
            if (e && e.cancelable) e.preventDefault();
            if (count < story.length) {
                msg.innerText = story[count];
            } else {
                msg.innerText = "Just take the red pill and click Yes.";
            }
            count++;
            scale += 0.05;
            yesBtn.style.transform = `scale(${scale})`;

            // Random movement within bounds
            const nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - 150);
            noBtn.style.left = Math.random() > 0.5 ? nX + 'px' : '20px';
            noBtn.style.top = nY + 'px';
        }

        function sayYes() {
            document.body.innerHTML = '<h1 style="color: #00FF41; margin-top: 40vh;">Excellent choice. ❤️</h1>';
            setTimeout(() => { window.location.reload(); }, 3000);
        }
    </script>
</body>
</html>
