<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine Final</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #question { font-size: 1.5rem; margin-top: 20px; min-height: 80px; z-index: 5; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            z-index: 5;
            cursor: pointer;
            position: relative;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 10;
            touch-action: none;
        }
        #message {
            margin-top: 40px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 60px;
            z-index: 5;
            padding: 0 15px;
            line-height: 1.4;
        }
        #counterContainer {
            position: fixed;
            top: 75vh; 
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border: 1px solid #00FF41;
            z-index: 5;
            background: rgba(0,0,0,0.95);
        }
        #counterText {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #00FF41;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .matrix-bit {
            position: fixed;
            top: -20px;
            color: #00FF41;
            font-size: 1rem;
            user-select: none;
            z-index: 1;
            animation: rain linear infinite;
        }
        /* Photo styling for the Yes screen */
        .val-photo {
            width: 120px;
            height: auto;
            border: 3px solid #00FF41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            border-radius: 4px;
            background: #000;
        }
    </style>
</head>
<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

    <div>
        <button id="yesBtn" onclick="sayYes()">Yes</button>
    </div>

    <div id="message"></div>

    <button id="noBtn" onmouseover="moveNo(event)" ontouchstart="moveNo(event)">No</button>

    <div id="counterContainer">
        <p style="font-size: 0.6rem; margin: 0 0 5px 0; letter-spacing: 1px; opacity: 0.8;">TOTAL ANOMALIES DETECTED
