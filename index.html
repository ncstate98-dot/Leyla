<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Matrix Valentine System</title>
    <style>
        * {
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent; box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b; color: #00FF41; font-family: 'Courier New', monospace;
            text-align: center; margin: 0; padding: 0; overflow: hidden;
            height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center;
        }

        /* MENU SCREEN */
        #entry-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .menu-btn {
            background: #000; border: 2px solid #00FF41; color: #00FF41;
            padding: 15px 30px; font-size: 1.1rem; cursor: pointer;
            box-shadow: 0 0 10px #00FF41; margin: 10px; width: 260px;
            font-family: 'Courier New', monospace; font-weight: bold;
        }
        .toggle-container { margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #111; border: 1px solid #00FF41; transition: .4s;
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 3px;
            background-color: #00FF41; transition: .4s;
        }
        input:checked + .slider:before { transform: translateX(26px); }

        /* GAME UI */
        #main-ui {
            width: 100%; height: 100vh; display: none;
            flex-direction: column; align-items: center;
            padding-top: 5px; position: relative; z-index: 5;
        }
        .tracker-label { font-size: 0.55rem; opacity: 0.7; margin: 2px 0; letter-spacing: 1px; }
        #heart-container, #miss-container {
            display: flex; gap: 1px; font-size: 0.75rem; 
            justify-content: center; width: 100%; white-space: nowrap;
        }

        #question { font-size: 1.1rem; margin: 10px 0; }
        #yesBtn {
            background-color: #28a745; color: white; padding: 12px 30px;
            font-size: 1.1rem; border: none; border-radius: 8px; font-weight: bold;
            z-index: 50; cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545; color: white; padding: 10px 22px;
            font-size: 1rem; border: none; border-radius: 8px; font-weight: bold;
            position: absolute; z-index: 60;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }
        #taunt { margin-top: 25px; height: 18px; font-size: 0.8rem; color: #ff4d4d; }
        #message { margin-top: 5px; font-size: 0.95rem; font-weight: bold; min-height: 70px; padding: 0 20px; }
        
        #counterContainer {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            padding: 8px 15px; border: 1px solid #00FF41; background: rgba(0,0,0,0.9);
        }
        .val-photo { width: 100px; border: 2px solid #00FF41; border-radius: 4px; margin: 5px; }
        .matrix-bit { position: fixed; top: -20px; color: #00FF41; animation: rain linear infinite; pointer-events: none; }
        @keyframes rain { 0% { transform: translateY(-100%); } 100% { transform: translateY(100vh); } }
    </style>
</head>
<body>

    <div id="entry-screen">
        <h2 style="font-size: 1.1rem; margin-bottom: 25px; letter-spacing: 2px;">SELECT PROTOCOL</h2>
        <div class="toggle-container">
            <span style="font-size: 0.7rem;">AUDIO FEED</span>
            <label class="switch">
                <input type="checkbox" id="musicToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <button class="menu-btn" onclick="initSystem('card')">ACCESS VIRTUAL CARD</button>
        <button class="menu-btn" onclick="initSystem('game')">INITIALIZE GAME</button>
    </div>

    <audio id="bgMusic" loop><source src="matrix.mp3" type="audio/mpeg"></audio>

    <div id="main-ui">
        <div id="hud-area">
            <div class="tracker-label">BYPASS PROGRESS</div>
            <div id="heart-container"></div>
            <div id="miss-label" class="tracker-label" style="margin-top: 4px; color: #00bcff;">MISS TRACKER</div>
            <div id="miss-container"></div>
        </div>

        <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <div id="taunt"></div>
        <div id="message">System Ready...</div>
        <button id="noBtn" onmousedown="handleNo(event)">No</button>
        
        <div id="counterContainer">
            <p style="font-size: 0.5rem; margin: 0; letter-spacing: 1px;">TOTAL ANOMALIES:</p>
            <div id="anomaly-value" style="font-size: 1.1rem; font-weight: bold; letter-spacing: 3px;">0000</div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const taunt = document.getElementById('taunt');
        const heartBox = document.getElementById('heart-container');
        const missBox = document.getElementById('miss-container');
        const anomalyVal = document.getElementById('anomaly-value');
        const mainUI = document.getElementById('main-ui');
        const counterBox = document.getElementById('counterContainer');
        const audio = document.getElementById('bgMusic');

        let hitCount = 0, missCount = 0, totalAnomalies = 0;
        let gameInterval, isGameOver = false, currentMode = 'game';
        let hitHearts = Array(12).fill("❤️"), missHearts = Array(12).fill("🔹");

        const story = [
            "Wait, maybe reconsider?", "Are you absolutely sure?", "I heard that Bobby is a catch...",
            "Choice is an illusion, Leyla.", "I'm trying to free your mind here.", "Still going for 'No'?",
            "Come on... Really?", "This is getting awkward.", "Someone thinks they're funny 😐",
            "Are you messing with me right now?", "System failing. No button losing power.",
            "Take the red pill. Only Yes remains."
        ];

        function initSystem(mode) {
            currentMode = mode;
            if (document.getElementById('musicToggle').checked) audio.play().catch(() => {});
            document.getElementById('entry-screen').style.display = "none";
            mainUI.style.display = "flex";
            
            if (mode === 'card') {
                document.getElementById('hud-area').style.visibility = "hidden";
                msg.innerText = "Classic Protocol Engaged.";
            } else {
                updateTrackers();
                startGame();
                document.addEventListener('mousedown', missedClick);
            }
            resetNo();
        }

        function updateTrackers() {
            heartBox.innerHTML = hitHearts.join("");
            missBox.innerHTML = missHearts.join("");
            anomalyVal.innerText = totalAnomalies.toString().padStart(4, '0');
        }

        function startGame() {
            clearInterval(gameInterval);
            gameInterval = setInterval(moveNoRandomly, 1600);
        }

        function moveNoRandomly() {
            if (isGameOver) return;
            const pad = 35;
            let nX, nY;
            
            const msgRect = msg.getBoundingClientRect();
            const counterRect = counterBox.getBoundingClientRect();
            const yesRect = yesBtn.getBoundingClientRect();
            const questionRect = document.getElementById('question').getBoundingClientRect();

            for(let i=0; i<200; i++) {
                nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - pad);
                nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - pad);
                
                const noRect = {
                    left: nX - 15,
                    right: nX + noBtn.offsetWidth + 15,
                    top: nY - 15,
                    bottom: nY + noBtn.offsetHeight + 15
                };

                const overlaps = (r1, r2) => !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);

                const isBlocked = overlaps(noRect, msgRect) || 
                                overlaps(noRect, counterRect) || 
                                overlaps(noRect, yesRect) ||
                                overlaps(noRect, questionRect);

                if (!isBlocked && nY > 180 && nY < (window.innerHeight - 100)) break;
            }
            noBtn.style.left = nX + 'px';
            noBtn.style.top = nY + 'px';
            noBtn.style.transform = `rotate(${Math.random() * 20 - 10}deg)`;
        }

        function handleNo(e) {
            e.stopPropagation();
            if (isGameOver) return;
            totalAnomalies++;
            
            if (hitCount < story.length) {
                if (currentMode === 'game') hitHearts[hitCount] = "💔";
                msg.innerText = story[hitCount];
                hitCount++;
                updateTrackers();
                
                // Jump away on hit for BOTH modes
                moveNoRandomly();
            }

            if (hitCount === story.length) {
                noBtn.style.display = "none";
                isGameOver = true;
                clearInterval(gameInterval);
            }
        }

        function missedClick(e) {
            if (currentMode === 'game' && !isGameOver) {
                if (e.target.id !== 'noBtn' && e.target.id !== 'yesBtn') {
                    totalAnomalies++;
                    if (missCount < 12) { missHearts[missCount] = "❌"; missCount++; }
                    updateTrackers();
                    taunt.innerText = "haha. missed me.";
                    setTimeout(() => { taunt.innerText = ""; }, 500);
                    if(missCount >= 12) { 
                        isGameOver = true; 
                        noBtn.style.display="none"; 
                        msg.style.color = "#ff4d4d";
                        msg.innerText="FATAL ERROR: Access Denied. Hit Yes."; 
                    }
                }
            }
        }

        function resetNo() {
            const yR = yesBtn.getBoundingClientRect();
            noBtn.style.left = (window.innerWidth/2 - noBtn.offsetWidth/2) + 'px';
            noBtn.style.top = (yR.bottom + 80) + 'px';
        }

        function sayYes() {
            isGameOver = true;
            clearInterval(gameInterval);
            mainUI.innerHTML = `
                <h1 style="color: #00FF41; font-size: 1.5rem; margin-top: 20px;">Excellent choice. ❤️</h1>
                <p style="color: #00FF41; font-size: 1rem; margin: 5px 0; font-weight: bold;">I feel lucky to have met you.</p>
                <div style="display: flex; justify-content: center; flex-wrap: wrap;">
                    <img src="valentine1.jpg" class="val-photo" style="transform: rotate(-5deg);">
                    <img src="valentine2.jpg" class="val-photo" style="transform: rotate(2deg);">
                    <img src="valentine3.jpg" class="val-photo" style="transform: rotate(3deg);">
                </div>
                <p style="color: #00FF41; font-size: 0.8rem; margin-top: 15px; max-width: 90%;">just like in the matrix, it's almost like you didn't have a choice, haha 😂</p>
                <p style="color: #00FF41; opacity: 0.6; font-size: 0.7rem; margin-top: 15px;">(System rebooting in 15 seconds...)</p>
            `;
            for(let i=0; i<40; i++) setTimeout(createRain, i * 60);
            setTimeout(() => window.location.reload(), 15000);
        }

        function createRain() {
            const bit = document.createElement('div');
            bit.className = 'matrix-bit';
            bit.innerText = Math.random() > 0.5 ? '1' : '0';
            bit.style.left = Math.random() * 100 + 'vw';
            bit.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(bit);
        }
    </script>
</body>
</html>
