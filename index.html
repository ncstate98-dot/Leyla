<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine Debug</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #question { font-size: 1.5rem; margin-top: 20px; min-height: 80px; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 100; /* Ensure it stays on top */
            touch-action: none;
        }
        #message {
            margin-top: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 60px;
            color: #00FF41;
        }
        /* DEBUG COUNTER: Bright and Big at the bottom */
        #viewCount { 
            font-size: 1.5rem; 
            color: yellow; 
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            margin-top: auto; 
            border: 2px solid yellow;
            z-index: 200;
        }
    </style>
</head>
<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

    <div style="margin-top: 20px;">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
    </div>

    <div id="message"></div>

    <button id="noBtn" onmouseover="moveNo(event)" ontouchstart="moveNo(event)">No</button>

    <div id="viewCount">Loading Counter...</div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const viewDiv = document.getElementById('viewCount');

        let scale = 1.0;
        let count = 0;

        const story = [
            "Wait, maybe reconsider?",
            "Are you absolutely sure?",
            "I heard that Bobby is a catch... maybe rethink that.",
            "Choice is an illusion, Leyla.",
            "I'm trying to free your mind here.",
            "Really? You're still going for 'No'?",
            "Come on... Really?",
            "This is getting a bit awkward now.",
            "Fate, it seems, is not without a sense of irony.",
            "ARE YOU FUCKING WITH ME!?"
        ];

        // --- TRACKING LOGIC ---
        const statsKey = 'leyla_valentine_debug_99'; // New key for fresh start
        
        async function updateCounter() {
            const isAdmin = localStorage.getItem('isAdmin');
            // Use 'hit' to increase, 'get' to just read
            let url = `https://api.countapi.xyz/${isAdmin ? 'get' : 'hit'}/${statsKey}/visits`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                if(data.value) {
                    viewDiv.innerText = `VIEWS: ${data.value}`;
                } else {
                    viewDiv.innerText = "Counter connected, no views yet.";
                }
            } catch (e) {
                viewDiv.innerText = "Counter Error: API blocked or down.";
                viewDiv.style.color = "red";
            }
        }

        window.onload = () => {
            updateCounter();
            // Start No button below Yes button
            const yRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (window.innerWidth / 2 - noBtn.offsetWidth / 2) + 'px';
            noBtn.style.top = (yRect.bottom + 40) + 'px';
        };

        function moveNo(e) {
            if (e && e.cancelable) e.preventDefault();
            if (count < story.length) {
                msg.innerText = story[count];
            } else {
                msg.innerText = "Just take the red pill and click Yes.";
            }
            count++;
            scale += 0.05; // Slightly faster growth for debug
            yesBtn.style.transform = `scale(${scale})`;

            // Random jump logic
            const nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - 100);
            noBtn.style.left = nX + 'px';
            noBtn.style.top = nY + 'px';
        }

        function sayYes() {
            document.body.innerHTML = '<h1 style="color: #00FF41; margin-top: 40vh;">Excellent choice. ❤️</h1>';
            setTimeout(() => { window.location.reload(); }, 3000);
        }
    </script>
</body>
</html>
