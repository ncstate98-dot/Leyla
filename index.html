<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Matrix Valentine Game</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #entry-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #entryBtn {
            background: none;
            border: 2px solid #00FF41;
            color: #00FF41;
            padding: 20px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 15px #00FF41;
        }
        #main-ui {
            width: 100%;
            height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            position: relative;
            z-index: 5;
        }
        #heart-container {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        #question { font-size: 1.3rem; margin-bottom: 20px; padding: 0 15px; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            z-index: 5;
            cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            transition: all 0.1s ease-out;
            z-index: 10;
        }
        #message {
            margin-top: 60px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 60px;
            padding: 0 25px;
            max-width: 85%;
        }
        #counterContainer {
            position: fixed;
            bottom: 20px; 
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 15px;
            border: 1px solid #00FF41;
            background: rgba(0,0,0,0.9);
        }
        .val-photo {
            width: 110px;
            height: auto;
            border: 3px solid #00FF41;
            border-radius: 4px;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .matrix-bit {
            position: fixed;
            top: -20px;
            color: #00FF41;
            animation: rain linear infinite;
        }
    </style>
</head>
<body onclick="missedClick(event)">

    <div id="entry-screen">
        <button id="entryBtn" onclick="initSystem()">INITIALIZE GAME</button>
        <p style="margin-top: 20px; font-size: 0.8rem; opacity: 0.7;">(Warning: High-Speed Anomaly Detected)</p>
    </div>

    <audio id="bgMusic" loop>
        <source src="matrix.mp3" type="audio/mpeg">
    </audio>

    <div id="main-ui">
        <div id="heart-container"></div>
        <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <div id="message">System Ready...</div>
        <button id="noBtn" onclick="hitNo(event)">No</button>
        
        <div id="counterContainer">
            <div style="font-size: 1.2rem; font-weight: bold; letter-spacing: 4px;">0014</div>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const heartBox = document.getElementById('heart-container');
        const audio = document.getElementById('bgMusic');
        const mainUI = document.getElementById('main-ui');

        let hitCount = 0;
        let gameSpeed = 600; // Starting beat speed in ms
        let gameInterval;
        let hearts = ["❤️","❤️","❤️","❤️","❤️","❤️","❤️","❤️","❤️","❤️"];

        const story = [
            "Wait, maybe reconsider?",
            "Are you absolutely sure?",
            "I heard that Bobby is a catch... maybe rethink that.",
            "Choice is an illusion, Leyla.",
            "I'm trying to free your mind here.",
            "Really? You're still going for 'No'?",
            "Come on... Really?",
            "This is getting a bit awkward now.",
            "I think someone is trying to be funny, that's awesome 😐",
            "Ok, me being the gentleman that I am, will respond with a: 'are you fucking with me?'"
        ];

        function updateHearts() {
            heartBox.innerHTML = hearts.join("");
        }

        function initSystem() {
            audio.play().catch(() => {});
            document.getElementById('entry-screen').style.display = "none";
            mainUI.style.display = "flex";
            updateHearts();
            resetNo();
            startGame();
        }

        function startGame() {
            clearInterval(gameInterval);
            gameInterval = setInterval(moveNoRandomly, gameSpeed);
        }

        function moveNoRandomly() {
            const pad = 30;
            let nX, nY;
            
            // Generate random spot that doesn't overlap text or Yes button
            for(let i=0; i<100; i++) {
                nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - pad);
                nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - pad);
                
                const yR = yesBtn.getBoundingClientRect();
                const qR = document.getElementById('question').getBoundingClientRect();
                const mR = msg.getBoundingClientRect();
                const cR = document.getElementById('counterContainer').getBoundingClientRect();

                const isOverlap = (x, y) => {
                    const r = {left: x, right: x + noBtn.offsetWidth, top: y, bottom: y + noBtn.offsetHeight};
                    const check = (r2) => !(r.right < r2.left-20 || r.left > r2.right+20 || r.bottom < r2.top-20 || r.top > r2.bottom+20);
                    return check(yR) || check(qR) || check(mR) || check(cR);
                };

                if (!isOverlap(nX, nY) && nY > 100) break;
            }
            noBtn.style.left = nX + 'px';
            noBtn.style.top = nY + 'px';
        }

        function hitNo(e) {
            e.stopPropagation(); // Prevents "missed click" from firing
            if (hitCount < story.length) {
                hearts[hitCount] = "💔";
                updateHearts();
                msg.innerText = story[hitCount];
                hitCount++;
                gameSpeed -= 50; // Get faster!
                startGame();
            }

            if (hitCount === story.length) {
                noBtn.style.display = "none";
                msg.innerText = "you win (sad face)";
                clearInterval(gameInterval);
            }
        }

        function missedClick(e) {
            if (mainUI.style.display === "flex" && hitCount < story.length) {
                msg.innerText = "haha. missed me.";
            }
        }

        function resetNo() {
            const yR = yesBtn.getBoundingClientRect();
            noBtn.style.left = (window.innerWidth / 2 - noBtn.offsetWidth / 2) + 'px';
            noBtn.style.top = (yR.bottom + 40) + 'px';
        }

        function sayYes() {
            mainUI.innerHTML = `
                <h1 style="color: #00FF41; font-size: 1.8rem; margin-top: 20px;">Excellent choice. ❤️</h1>
                <p style="color: #00FF41; font-size: 1.2rem; margin: 15px 0; font-weight: bold;">I'm so glad I met you.</p>
                <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                    <img src="valentine1.jpg" class="val-photo" style="transform: rotate(-5deg);">
                    <img src="valentine2.jpg" class="val-photo" style="transform: rotate(2deg);">
                    <img src="valentine3.jpg" class="val-photo" style="transform: rotate(-3deg);">
                </div>
                <p style="color: #00FF41; font-size: 1rem; font-weight: bold; margin-top: 20px;">just like in the matrix, it's almost like you didn't have a choice, haha 😂</p>
            `;
            for(let i=0; i<40; i++) { setTimeout(createRain, i * 60); }
            setTimeout(() => { window.location.reload(); }, 15000);
        }

        function createRain() {
            const bit = document.createElement('div');
            bit.className = 'matrix-bit';
            bit.innerText = Math.random() > 0.5 ? '1' : '0';
            bit.style.left = Math.random() * 100 + 'vw';
            bit.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(bit);
        }
    </script>
</body>
</html>
