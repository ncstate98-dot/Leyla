<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine Final</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #question { font-size: 1.5rem; margin-top: 20px; min-height: 80px; z-index: 5; position: relative; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            z-index: 5;
            cursor: pointer;
            position: relative;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 10;
            touch-action: none;
        }
        #message {
            margin-top: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 50px;
            z-index: 5;
            position: relative;
        }
        #counterContainer {
            margin-top: auto;
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #00FF41;
            z-index: 5;
            background: black;
            position: relative;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .matrix-bit {
            position: fixed;
            top: -20px;
            color: #00FF41;
            font-size: 1rem;
            user-select: none;
            z-index: 1;
            animation: rain linear infinite;
        }
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0b0b;
            z-index: 100;
        }
    </style>
</head>
<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

    <div>
        <button id="yesBtn" onclick="sayYes()">Yes</button>
    </div>

    <div id="message"></div>

    <button id="noBtn" onmouseover="moveNo(event)" ontouchstart="moveNo(event)">No</button>

    <div id="counterContainer">
        <p style="font-size: 0.7rem; margin: 0 0 5px 0;">SYSTEM TRAFFIC</p>
        <img src="https://counter.ghidini.me/get/@leyla-valentine-2026?theme=rule" alt="Hits">
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const q = document.getElementById('question');
        const counter = document.getElementById('counterContainer');

        let scale = 1.0;
        let count = 0;

        const story = [
            "Wait, maybe reconsider?",
            "Are you absolutely sure?",
            "I heard that Bobby is a catch... maybe rethink that.",
            "Choice is an illusion, Leyla.",
            "I'm trying to free your mind here.",
            "Really? You're still going for 'No'?",
            "Come on... Really?",
            "This is getting a bit awkward now.",
            "Fate, it seems, is not without a sense of irony.",
            "ARE YOU FUCKING WITH ME!?"
        ];

        window.onload = () => {
            resetNoButton();
        };

        function resetNoButton() {
            const yRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (window.innerWidth / 2 - noBtn.offsetWidth / 2) + 'px';
            noBtn.style.top = (yRect.bottom + 50) + 'px';
        }

        function moveNo(e) {
            if (e && e.cancelable) e.preventDefault();
            
            if (count < story.length) {
                msg.innerText = story[count];
            } else {
                msg.innerText = "Just take the red pill and click Yes.";
            }
            count++;
            scale += 0.04;
            yesBtn.style.transform = `scale(${scale})`;

            // Overlap prevention logic
            let nX, nY;
            const pad = 20;
            
            for(let i=0; i<100; i++) {
                nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - pad);
                nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - pad);
                
                const nR = { left: nX, right: nX + noBtn.offsetWidth, top: nY, bottom: nY + noBtn.offsetHeight };
                const yR = yesBtn.getBoundingClientRect();
                const qR = q.getBoundingClientRect();
                const mR = msg.getBoundingClientRect();
                const cR = counter.getBoundingClientRect();

                const overlap = (r1, r2) => !(r1.right < r2.left - 10 || r1.left > r2.right + 10 || r1.bottom < r2.top - 10 || r1.top > r2.bottom + 10);

                if (!overlap(nR, yR) && !overlap(nR, qR) && !overlap(nR, mR) && !overlap(nR, cR)) break;
            }

            noBtn.style.left = nX + 'px';
            noBtn.style.top = nY + 'px';
        }

        function createRainBit() {
            const bit = document.createElement('div');
            bit.className = 'matrix-bit';
            bit.innerText = Math.random() > 0.5 ? '1' : '0';
            bit.style.left = Math.random() * 100 + 'vw';
            bit.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(bit);
        }

        function sayYes() {
            // Create a clean overlay for the Matrix effect
            const overlay = document.createElement('div');
            overlay.className = 'success-overlay';
            overlay.innerHTML = '<h1 style="color: #00FF41; font-size: 2.5rem; text-shadow: 0 0 10px #00FF41; z-index: 110;">Excellent choice. ❤️</h1>';
            document.body.appendChild(overlay);

            for(let i = 0; i < 50; i++) {
                setTimeout(createRainBit, i * 60);
            }
            
            setTimeout(() => { window.location.reload(); }, 4500);
        }
    </script>
</body>
</html>
