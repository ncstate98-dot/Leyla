<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine's Request</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0b0b;
            color: #00FF41;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            text-align: center;
            box-sizing: border-box;
        }
        h1 { font-size: 1.8rem; margin-bottom: 50px; }
        
        /* This container keeps buttons side-by-side initially */
        .btn-container { 
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            touch-action: none; /* Prevents default phone behavior */
        }

        #yesBtn { background-color: #28a745; color: white; position: relative; }
        
        #noBtn {
            background-color: #dc3545;
            color: white;
            position: relative; /* Starts relative, then JS turns it absolute */
            transition: 0.1s;
        }

        #message {
            margin-top: 50px;
            font-size: 1rem;
            color: #00FF41;
            min-height: 3em;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

    <div class="btn-container">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()" onclick="moveNo()">No</button>
    </div>

    <div id="message"></div>

    <script>
        let noCount = 0;
        const noBtn = document.getElementById('noBtn');
        const messageDiv = document.getElementById('message');

        const responses = [
            "Hey, are you sure about this?", "You think you're funny?", "There is no spoon...",
            "I'm trying to free your mind, Leyla.", "Choice is an illusion.",
            "Fate, it seems, is not without a sense of irony.", "Not like this...",
            "You take the blue pill, the story ends.", "I can only show you the door.",
            "Denial is the most predictable response.", "Why do you persist?",
            "Were you looking at the girl in the red dress?", "Everything has a beginning and an end.",
            "You're beginning to believe!", "I know kung fu.", "It is the question that drives us.",
            "The Matrix is everywhere.", "Buckle your seatbelt, Dorothy.",
            "Dodging bullets is easy. Dodging this? Harder.", "What is 'Real'?",
            "You’ve already made the choice.", "Human beings are a disease.",
            "Ignorance is bliss.", "A world without rules.", "Stop trying to hit me and hit me!",
            "The answer is out there, Leyla.", "A déjà vu is a glitch.",
            "Would you still have tried to hit No?", "Is that air you're breathing?",
            "Your mind makes it real.", "The body cannot live without the 'Yes'.",
            "Error 404: No not found.", "You are the One.", "Don't think you are, know you are.",
            "Follow the white rabbit.", "This is your last chance.",
            "A world where you said Yes.", "You look like Trinity when you're stubborn.",
            "Because I choose to!", "Walking the path vs knowing the path.",
            "You're faster than this!", "I'm the Architect of this page.",
            "To deny impulses is to deny being human.", "Goodbye, Mr. Anderson...",
            "The sound of inevitability.", "The Oracle predicted this.", "Just click Yes."
        ];

        const yesMessages = [
            "YES! (Did you try the no button, just to see what happens?)",
            "I knew it! (Did you see how fast that No button was?)",
            "Excellent choice.", "Victory!", "Welcome to the real world."
        ];

        function moveNo() {
            noCount++;
            
            // On the very first attempt, we switch to absolute so it can jump anywhere
            if (noBtn.style.position !== 'absolute') {
                noBtn.style.position = 'absolute';
            }

            // Calculate random coordinates
            // We subtract button size so it doesn't go off-screen
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const newX = Math.floor(Math.random() * maxX);
            const newY = Math.floor(Math.random() * maxY);
            
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';

            if (noCount % 5 === 0) {
                const randomIndex = Math.floor(Math.random() * responses.length);
                messageDiv.innerText = responses[randomIndex];
            }
        }

        function sayYes() {
            const randomYes = yesMessages[Math.floor(Math.random() * yesMessages.length)];
            document.body.innerHTML = `
                <h1 style="color: #00FF41;">${randomYes}</h1>
                <p style="font-size: 5rem;">❤️</p>
                <p style="color: #00FF41; opacity: 0.7;">(System rebooting in 5 seconds...)</p>
            `;
            setTimeout(() => { location.reload(); }, 5000);
        }
    </script>
</body>
</html>
