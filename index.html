<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Valentine</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00FF41;
            font-family: 'Courier New', monospace;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #question { font-size: 1.5rem; margin-bottom: 30px; z-index: 5; }
        #yesBtn {
            background-color: #28a745;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s;
            z-index: 5;
            cursor: pointer;
        }
        #noBtn {
            background-color: #dc3545;
            color: white;
            padding: 15px 35px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            position: absolute;
            z-index: 10;
            touch-action: none;
        }
        #message {
            margin-top: 40px;
            font-size: 1rem;
            font-weight: bold;
            min-height: 50px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <h1 id="question">hi Leyla ❤️, will you be my Valentine?</h1>

    <div>
        <button id="yesBtn" onclick="sayYes()">Yes</button>
    </div>

    <div id="message"></div>

    <button id="noBtn" onmouseover="moveNo()" ontouchstart="moveNo()">No</button>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const msg = document.getElementById('message');
        const q = document.getElementById('question');

        let scale = 1.0;
        let count = 0;

        const story = [
            "I was in San Bernardino, California...",
            "...in August...",
            "...at 4 o'clock in the afternoon.",
            "It's like 115 degrees out.",
            "I'm just standing there, sweating.",
            "And this lady comes up to me...",
            "She looks me dead in the eye...",
            "And she asks me if I'm cold.",
            "Me, being a gentleman, said...",
            "ARE YOU FUCKING WITH ME!?"
        ];

        window.onload = () => {
            // Force No button to start clearly below the Yes button
            const yRect = yesBtn.getBoundingClientRect();
            noBtn.style.left = (window.innerWidth / 2 - noBtn.offsetWidth / 2) + 'px';
            noBtn.style.top = (yRect.bottom + 60) + 'px';
        };

        function moveNo() {
            // Text logic
            if (count < story.length) {
                msg.innerText = story[count];
            } else {
                msg.innerText = "Choice is an illusion, Leyla.";
            }
            count++;

            // 3% Growth
            scale += 0.03;
            yesBtn.style.transform = `scale(${scale})`;

            // Jump logic
            const pad = 40;
            let nX, nY, tooClose;
            
            for(let i=0; i<50; i++) {
                nX = Math.random() * (window.innerWidth - noBtn.offsetWidth - pad);
                nY = Math.random() * (window.innerHeight - noBtn.offsetHeight - pad);
                
                const nR = { left: nX, right: nX + noBtn.offsetWidth, top: nY, bottom: nY + noBtn.offsetHeight };
                const yR = yesBtn.getBoundingClientRect();
                const qR = q.getBoundingClientRect();
                const mR = msg.getBoundingClientRect();

                const overlap = (r1, r2) => !(r1.right < r2.left - 20 || r1.left > r2.right + 20 || r1.bottom < r2.top - 20 || r1.top > r2.bottom + 20);

                if (!overlap(nR, yR) && !overlap(nR, qR) && !overlap(nR, mR)) break;
            }

            noBtn.style.left = nX + 'px';
            noBtn.style.top = nY + 'px';
        }

        function sayYes() {
            document.body.innerHTML = '<h1 style="color: #00FF41; margin-top: 40vh;">Excellent choice. ❤️</h1>';
        }
    </script>
</body>
</html>
